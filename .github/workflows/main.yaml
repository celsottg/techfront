name: CI Frontend TechFront

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  ci-frontend:
    name: Lint · Type-check · Tests · Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Type-check (TypeScript strict mode)
        run: npm run type-check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Testes unitários (Vitest + Testing Library)
        run: npm run test

      - name: Build de produção (tsc + vite build)
        run: npm run build
